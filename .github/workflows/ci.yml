name: Cohere batch 08 North SDK validation
on:
  push:
    branches: ['validation/cohere-19-08']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '${{ matrix.python-version }}'
      - run: uv sync --dev
      - name: Prepare offline test guard
        run: |
          mkdir -p "$RUNNER_TEMP/cohere-offline-guard"
          cat > "$RUNNER_TEMP/cohere-offline-guard/sitecustomize.py" <<'PY'
          import socket
          def deny_network(*args, **kwargs):
              raise AssertionError("Network access is disabled during offline SDK tests")
          socket.socket.connect = deny_network
          socket.socket.connect_ex = deny_network
          PY
          cat > "$RUNNER_TEMP/cohere-offline-guard/cohere_offline_fixtures.py" <<'PY'
          from io import BytesIO
          import urllib.request
          import pytest

          @pytest.fixture(autouse=True)
          def mock_existing_unstubbed_discovery(request, monkeypatch):
              if request.node.name in {
                  "test_missing_kid_header",
                  "test_x_north_headers_trusted_issuers_missing_kid",
              }:
                  monkeypatch.setattr(
                      urllib.request, "urlopen",
                      lambda *a, **kw: BytesIO(b'{"jwks_uri":"https://issuer.test/jwks"}'),
                  )
          PY
      - name: Prove regression against exact main
        run: |
          cat > "$RUNNER_TEMP/prove-before.py" <<'PY'
          import pathlib, subprocess, xml.etree.ElementTree as ET
          path = pathlib.Path("src/north_mcp_python_sdk/auth.py")
          head = path.read_bytes()
          try:
              path.write_bytes(subprocess.check_output(["git", "show", "069489699204bd4815ab85bb5fd798b807a6a980:src/north_mcp_python_sdk/auth.py"]))
              result = subprocess.run(["uv", "run", "pytest", "-q", "tests/test_auth_event_loop.py", "--junitxml=/tmp/cohere-before.xml"])
              suites = ET.parse("/tmp/cohere-before.xml").getroot()
              failures = len(suites.findall(".//testcase/failure"))
              errors = len(suites.findall(".//testcase/error"))
              total = len(suites.findall(".//testcase"))
              print("REGRESSION_BEFORE", result.returncode, total, failures, errors, flush=True)
              assert result.returncode == 1 and total == 4 and failures == 2 and errors == 0
          finally:
              path.write_bytes(head)
          PY
          uv run env PYTHONPATH="$RUNNER_TEMP/cohere-offline-guard:$PWD/src" python "$RUNNER_TEMP/prove-before.py"
      - name: Run focused tests
        run: uv run env PYTHONPATH="$RUNNER_TEMP/cohere-offline-guard:$PWD/src" pytest -q tests/test_auth_event_loop.py
      - name: Run full tests
        run: uv run env PYTHONPATH="$RUNNER_TEMP/cohere-offline-guard:$PWD/src" pytest -q -p cohere_offline_fixtures
      - run: uv run ruff check .
      - run: uv format --preview-features format --check
      - run: uv build
      - run: git diff --check
      - run: git diff --exit-code
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          test "$(git diff --name-only 42c842e8128833c0169b545b382f64aeb4dade86 HEAD)" = ".github/workflows/ci.yml"
          git push origin 42c842e8128833c0169b545b382f64aeb4dade86:refs/heads/fix/offload-oidc-verification
